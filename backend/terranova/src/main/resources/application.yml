server:
  address: 0.0.0.0
  port:  ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB    # Tamaño máximo permitido por archivo
      max-request-size: 20MB # Tamaño máximo total de la petición
  application:
    name: terranova

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/terranova_db?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:terranova}
    password: ${SPRING_DATASOURCE_PASSWORD:terranova}
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework: DEBUG
    org.hibernate: DEBUG
    com.zaxxer.hikari: DEBUG

app:
  uploads:
    dir: uploads
    base-url: http://localhost:8080/uploads/